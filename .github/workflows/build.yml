name: Build and test

# A push or pull request that changes only Markdown files does not build. If it also changes anything else, it does.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0, net11.0]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Build
        run: dotnet build ExcelNumberFormat.slnx --configuration Release -p:TreatWarningsAsErrors=true

      - name: Test (${{ matrix.framework }})
        run: dotnet run --project test/ExcelNumberFormat.Tests --configuration Release --framework ${{ matrix.framework }} --no-build
