name: Pre-release

on:
  workflow_dispatch:
    inputs:
      prerelease-label:
        description: 'Pre-release label (alpha, beta, rc)'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - rc
      dry-run:
        description: 'Dry run (build, test, pack — skip NuGet publish)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest

    env:
      MinVerDefaultPreReleaseIdentifiers: ${{ inputs.prerelease-label }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Show inputs
        env:
          BRANCH: ${{ github.ref_name }}
          LABEL: ${{ inputs.prerelease-label }}
        run: |
          echo "Branch: $BRANCH"
          echo "Pre-release label: $LABEL"

      - name: Build
        run: dotnet build ExcelNumberFormat.slnx --configuration Release

      - name: Test
        run: |
          for framework in net8.0 net10.0 net11.0; do
            dotnet run --project test/ExcelNumberFormat.Tests --configuration Release --framework $framework --no-build
          done

      - name: Pack
        run: dotnet pack src/ExcelNumberFormat/ExcelNumberFormat.csproj --configuration Release --no-build --output ./artifacts

      - name: Show package version
        run: ls -la ./artifacts/

      # On a commit that sits exactly on a stable tag MinVer yields a stable version, and a
      # stable version must only be published by Publish Release.
      - name: Verify the package is a pre-release
        run: |
          status=0
          for package in ./artifacts/*.nupkg; do
            name=$(basename "$package" .nupkg)
            if ! printf '%s' "$name" | grep -qE '\.[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$'; then
              echo "::error::$name is not a pre-release version — use Publish Release for stable versions"
              status=1
            fi
          done
          exit $status

      - name: NuGet login
        if: ${{ inputs.dry-run == false }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: jafin

      - name: Push to NuGet
        if: ${{ inputs.dry-run == false }}
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Dry run — skipped NuGet publish
        if: ${{ inputs.dry-run == true }}
        run: echo "Dry run enabled — the package was built but not published to NuGet."
